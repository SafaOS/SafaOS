[package]
name = "safa-helper"
version = "0.2.0"
edition = "2024"
description = "The SafaOS's build system and helper tools"

[lib]
name = "safa_builder"
path = "src/builder.rs"

[[test]]
name = "test"
path = "src/test.rs"
harness = false

[dependencies]
cargo_metadata = "0.19.2"
cfg-if = "1.0.0"
clap = { version = "4.5.37", features = ["derive"] }
curl = "0.4.47"
elf = "0.8.0"
flate2 = "1.1.1"
object = { version = "0.41.0", default-features = false, features = ["std", "elf", "build"] }

read = "0.1.1"
ring = "0.17.14"
rustc-demangle = "0.1.28"
serde = "1.0.219"
serde_json = "1.0.140"
tar = "0.4.44"
tempfile = "3.19.1"
thiserror = "2.0.21"
zip = { version = "8.5.0", default-features = false, features = ["time", "deflate-flate2"] }

[dev-dependencies]
