[package]
name = "safa-acore"
version = "0.1.0"
edition = "2024"

[dependencies]
bitfield-struct = "0.13.0"
bitflags = { version = "2.13.1", default-features = false }
const-str = "1.1.0"
int-enum = "1.2.0"
limine = "0.6.5"
thiserror = { version = "2.0.20", default-features = false }



[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
debug = 1
overflow-checks = true
