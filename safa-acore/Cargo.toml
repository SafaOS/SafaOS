[package]
name = "safa-acore"
version = "0.1.0"
edition = "2024"

[dependencies]
acpi = "6.1.1"
bitfield-struct = "0.13.0"
bitflags = { version = "2.13.1", default-features = false }
elf = { version = "0.8.0", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
heapless = "0.9.3"
int-enum = "1.3.0"
libakernel = { path = "../libakernel", features = ["kerneldep"] }
limine = "0.6.5"
noto-sans-mono-bitmap = { version = "0.3.2", default-features = false, features = ["regular", "size_20", "unicode-basic-latin", "unicode-specials"] }
thiserror = { version = "2.0.20", default-features = false }
vte = { version = "0.15.0", default-features = false }

[dev-dependencies]
const-str = "1.1.0"

[profile.dev]
opt-level = 2
panic = "abort"

[profile.release]
debug = 1
overflow-checks = true
panic = "abort"
