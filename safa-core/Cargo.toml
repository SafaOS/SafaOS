[package]
name = "safa-core"
version = "0.6.0"
edition = "2024"

[features]
trace_syscall = []

[dependencies]
noto-sans-mono-bitmap = { version = "0.3.0", features = ["size_20"] }
safa-abi = { path = "../safa-abi" }

bitflags = "2.6.0"
hashbrown = { version = "0.17.1", features = ["nightly"] }
heapless = { version = "0.8.0", features = ["serde"] }
int-enum = "1.1"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
limine = "0.5.0"
macros = { path = "macros" }
spin = {
  git = "https://github.com/safiworks/spin-fork",
  version = "0.10.0",
  default-features = false,
  features = [
    "lazy",
  ]
}

serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = {
  git = "https://github.com/safiworks/srede-json-frok",
  version = "1.0",
  default-features = false,
  features = [
    "alloc",
  ]
}

bitfield-struct = "0.11.0"
cfg-if = "1.0.0"
compile-time = "0.2"
derive-mmio = "0.8.0"
hfdt-rs = { git = "https://github.com/safiworks/hfdt-rs", version = "0.1.0" }
lock_api = { version = "0.4.12", features = ["serde"] }
rustc-demangle = "0.1.25"
rustc-hash = { version = "2.1.1", default-features = false }
slab = { version = "0.4", default-features = false }
smallvec = { version = "1.15.1", features = ["const_generics", "const_new", "union"] }
thiserror = { version = "2.0.12", default-features = false }

[dev-dependencies]

[workspace]
members = ["macros"]

[profile.dev]
opt-level = 2
panic = "abort"

[profile.release]
debug = 1
overflow-checks = true
panic = "abort"
strip = "none"
