[package]
name = "libakernel"
version = "0.1.0"
edition = "2024"

[features]
default = []
custom_panic_handler = []
kerneldep = ["custom_panic_handler"]

[dependencies]
bitflags = "2.13.2"
heapless = { version = "0.9.3", default-features = false, features = [] }
macros = { path = "macros" }
pin-project-lite = "0.2.17"
thiserror = { version = "2.0.21", default-features = false }

[workspace]
members = ["macros"]
